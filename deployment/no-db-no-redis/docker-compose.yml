# Fixed, so the project (and its volumes) don't change with the folder name.
name: gym-ledger-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-ledger-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    # Allows the container to reach services (postgres, redis) running on the host
    # via host.docker.internal — use that hostname in DATABASE_URL / REDIS_URL in .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
