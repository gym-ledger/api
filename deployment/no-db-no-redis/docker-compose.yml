# Fixed, so the project (and its volumes) don't change with the folder name.
name: gym-ledger-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-ledger-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    # Allows the container to reach services (postgres, redis) running on the host
    # via host.docker.internal — use that hostname in DATABASE_URL / REDIS_URL in .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Nightly encrypted backups of every database on your Postgres server to
  # S3-compatible storage. Idles until BACKUP_S3_BUCKET etc. are set in .env
  # (deployment/BACKUPS.md). Needs a superuser login to that server.
  backup:
    build:
      context: ./deployment/backup
    container_name: gym-ledger-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: ${BACKUP_PGHOST:-host.docker.internal}
      PGPORT: ${BACKUP_PGPORT:-5432}
      PGUSER: ${BACKUP_PGUSER:-}
      PGPASSWORD: ${BACKUP_PGPASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Monitoring (optional; deployment/monitoring/MONITORING.md) ─────────────
  # Started only with COMPOSE_PROFILES=monitoring in .env. Prometheus scrapes
  # the API's metrics port over the Docker network; Grafana shows dashboards
  # and sends alerts. Both listen on 127.0.0.1 only: open them through an
  # SSH tunnel, Tailscale or Cloudflare Access, never a public port.
  prometheus:
    build:
      context: ./deployment/monitoring/prometheus
    container_name: gym-ledger-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus

  grafana:
    # Config is copied into the image (see its Dockerfile): the deploy's
    # umask 077 checkout would be unreadable to Grafana as a bind mount.
    build:
      context: ./deployment/monitoring/grafana
    container_name: gym-ledger-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Only applied the first time Grafana starts (then it lives in
      # grafana_data); change it later in Grafana or with grafana-cli.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3002}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # Alert emails, e.g. through Resend's SMTP (user "resend", password =
      # an API key). Alerting stays off while ALERT_EMAIL_TO is empty.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.resend.com:587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-resend}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      # A bare address; the name goes in GRAFANA_SMTP_FROM_NAME. Grafana
      # refuses to start on a "Name <address>" value, even with SMTP off.
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-Gym Ledger alerts}
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Optional: publishes Grafana at a hostname of yours through a Cloudflare
  # Tunnel, behind a Cloudflare Access login. Needs both profiles:
  # COMPOSE_PROFILES=monitoring,cloudflare-tunnel (MONITORING.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: gym-ledger-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare-tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - grafana

volumes:
  prometheus_data:
  grafana_data:
