# Fixed, so the project (and its volumes) don't change with the folder name.
name: gym-ledger-api

services:
  postgres:
    image: postgres:16
    container_name: postgres16
    restart: unless-stopped
    env_file:
      - .env
    # Loopback only. A bare "5432:5432" binds 0.0.0.0 and Docker bypasses
    # UFW/iptables, putting the DB on the internet. The API reaches it over
    # app-network; this mapping is just for host-side psql / SSH tunnels.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Loopback only (see postgres above).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-ledger-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # Nightly encrypted backups of every database to S3-compatible storage.
  # Idles until BACKUP_S3_BUCKET etc. are set in .env (deployment/BACKUPS.md).
  backup:
    build:
      context: ./deployment/backup
    container_name: gym-ledger-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # Optional live standby, primary side (deployment/BACKUPS.md). Runs once per
  # deploy: sets replication up when REPLICATION_ENABLED=true and removes it
  # otherwise. Never restarts the postgres container.
  replication-setup:
    image: postgres:16
    restart: "no"
    entrypoint: ["sh", "/scripts/setup-primary.sh"]
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/replication/setup-primary.sh:/scripts/setup-primary.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # Lets the standby reach the database on this server's private IP only
  # (REPLICATION_BIND_IP). Idles when replication is off.
  replication-proxy:
    build:
      context: ./deployment/replication
      dockerfile: Dockerfile.proxy
    container_name: gym-ledger-replication-proxy
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env

  # ── Monitoring (optional; deployment/monitoring/MONITORING.md) ─────────────
  # Started only with COMPOSE_PROFILES=monitoring in .env. Prometheus scrapes
  # the API's metrics port over the Docker network; Grafana shows dashboards
  # and sends alerts. Both listen on 127.0.0.1 only: open them through an
  # SSH tunnel, Tailscale or Cloudflare Access, never a public port.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: gym-ledger-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployment/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: gym-ledger-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    entrypoint: ["sh", "/etc/gym-ledger/entrypoint.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Only applied the first time Grafana starts (then it lives in
      # grafana_data); change it later in Grafana or with grafana-cli.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3002}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # Alert emails, e.g. through Resend's SMTP (user "resend", password =
      # an API key). Alerting stays off while ALERT_EMAIL_TO is empty.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.resend.com:587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-resend}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-Gym Ledger alerts}
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./deployment/monitoring/grafana/entrypoint.sh:/etc/gym-ledger/entrypoint.sh:ro
      - ./deployment/monitoring/grafana/alerting:/etc/gym-ledger/alerting:ro
      - ./deployment/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deployment/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployment/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network

  # Optional: publishes Grafana at a hostname of yours through a Cloudflare
  # Tunnel, behind a Cloudflare Access login. Needs both profiles:
  # COMPOSE_PROFILES=monitoring,cloudflare-tunnel (MONITORING.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: gym-ledger-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare-tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - grafana
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
