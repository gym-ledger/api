# Deploys to the VPS when main is pushed. The same file is in all three repos;
# which repo gets deployed is fixed on the server by the SSH key each repo
# holds (see deployment/ci/setup-server.sh in workout-gym-api).
#
# Needs, in this repo's settings:
#   Variables (Secrets and variables > Actions > Variables):
#     DEPLOY_ENABLED = true    the on/off switch; anything else skips deploys
#     DEPLOY_HEALTH_URL        a page that answers once the new version is up
#   Environment "production" (deployments from main only), with secrets:
#     DEPLOY_HOST, DEPLOY_PORT, DEPLOY_KNOWN_HOSTS, DEPLOY_SSH_KEY
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys of this repo at once; a newer push waits its turn.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only the owner's pushes deploy. GitHub authenticates who pushed
    # (github.actor); a commit's author name and email are not checked by
    # anyone, so they aren't what decides this. Forks never deploy.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.repository_owner == 'itsmohitchahal' &&
      github.actor == 'itsmohitchahal' &&
      github.triggering_actor == 'itsmohitchahal'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - name: Deploy on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's key decides what runs; this only sends the commit id.
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "deploy@$HOST" "$GITHUB_SHA"

      - name: Check it's live
        if: vars.DEPLOY_HEALTH_URL != ''
        env:
          URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          for _ in $(seq 1 18); do
            if curl -fsSL --max-time 10 -o /dev/null "$URL"; then
              echo "Live: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL didn't respond within 3 minutes of the deploy"
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
